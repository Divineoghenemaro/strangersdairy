        <ul class="nav-links">

    <div class="container entry-container">
      <header class="hero">
        <h1 id="form-heading">New entry</h1>
        <p>
          Add a new blog post 
        </p>
      </header>

      <form class="entry-form" id="entry-form">
        <div class="field">
          <label for="title">Title</label>
          <input
            type="text"
            id="title"
            name="title"
            required
            placeholder="What are you calling this?"
          />
        </div>

        <div class="field">
          <label for="category">Category</label>
          <input
            type="text"
            id="category"
            name="category"
            required
            list="category-options"
            placeholder="e.g. Craft, Reading, Wandering, Everyday"
          />
          <datalist id="category-options"></datalist>
          <p class="field-hint">Pick an existing category or type a new one.</p>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required />
        </div>

        <div class="field">
          <label for="excerpt">Summary</label>
          <input
            type="text"
            id="excerpt"
            name="excerpt" 
            maxlength="120"
            required
            placeholder="A short text summarizing your post"
          />
        </div>

        <div class="field">
          <label for="body">Body</label>
          <textarea
            id="body"
            name="body"
            required
            placeholder="Write the detailed post here. Hit enter twice to leave a blank space between paragraphs"
          ></textarea>
          <p class="field-hint">Separate paragraphs for easy reading.</p>
        </div>

        <div class="field">
          <label for="image">Cover image</label>
          <input type="file" id="image" name="image" accept="image/*" required />
          <input type="hidden" id="image-data" />
          <img id="image-preview" alt="" style="display: none" />
          <p class="field-hint">
            JPEG or PNG only. Image is resized automatically.
            <button
              type="button"
              id="remove-image-btn"
              class="btn-text"
              style="display: none; padding: 0"
            >
              Remove image
            </button>
          </p>
        </div>

        <p class="form-error" id="form-error">
          Please fill in every field before saving.
        </p>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="save-btn">
            Save entry
          </button>
          <button type="button" class="btn-text" id="cancel-btn">Cancel</button>
        </div>
      </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/storage.js"></script>
  <script src="js/identity.js"></script>
