<!doctype html>
<html lang="en">
<head>
  <script>
window.addEventListener('error', function(e) {
  alert('JS ERROR: ' + e.message);
});
window.addEventListener('unhandledrejection', function(e) {
  alert('PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in </title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">Strangersdiary</a>
      
      <input type="checkbox" id="menu" />
        <label for="menu" class="menu-btn nav-menu"> &#9776 </label>
      
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Public</a></li>
      </ul>
    </div>
  </nav>

  <main class="page-shell">
    <header class="hero">
      <h1>Admin sign in</h1>
      <p>Sign in to manage entries.</p>
    </header>

    <form class="entry-form" id="login-form" style="max-width:520px; margin: 2rem auto;">
      <label for="email">Email</label> </br>
      <input id="email" name="email" type="email" autocomplete="username" required>

    </br>

      <label for="password">Password</label> </br>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <p class="form-error" id="login-error" style="display:none;"></p>
      <div class="form-actions">
        <button type="submit" id="login-btn">Sign in</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/storage.js"></script>
  <script>

    function getSafeNextPage() {
    const next = new URLSearchParams(location.search).get('next');
    if (!next || next.includes('://') || next.startsWith('//')) return 'evermorec.html';
    const allowed = ['evermorec.html', 'evermorenp.html', 'evermorep.html'];
    const path = next.split('?')[0];
    return allowed.includes(path) ? next : 'evermorec.html';
    }
    document.addEventListener('DOMContentLoaded', async () => {
      const existing = await getCurrentUser();
      if (existing) location.replace(getSafeNextPage());

      const form = document.getElementById('login-form');
      const error = document.getElementById('login-error');
      const button = document.getElementById('login-btn');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.style.display = 'none';
        button.disabled = true;
        button.textContent = 'Signing in…';
        try {
          await signIn(
            document.getElementById('email').value.trim(),
            document.getElementById('password').value
          );
          location.replace(getSafeNextPage());
        } catch (err) {
          console.error('Sign in failed:', err);
          error.textContent = 'Sign in failed. Check your email and password and try again.';
          error.style.display = 'block';
          button.disabled = false;
          button.textContent = 'Sign in';
        }
      });
    });
  </script>
</body>
</html>
